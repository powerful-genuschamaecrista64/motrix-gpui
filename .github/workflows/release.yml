name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle and sign
        env:
          TARGET: ${{ matrix.target }}
          SKIP_BUILD: "1"
          SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
        run: ./scripts/bundle-macos.sh release

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg
          cp -R target/Motrix.app /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "Motrix" -srcfolder /tmp/dmg -ov \
            -format UDZO "Motrix-macOS-${{ matrix.arch }}.dmg"
          codesign --force --timestamp \
            --sign "Developer ID Application: MOE AI LLC (NCFNX3LJ83)" \
            "Motrix-macOS-${{ matrix.arch }}.dmg"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "Motrix-macOS-${{ matrix.arch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "Motrix-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Motrix-macOS-${{ matrix.arch }}.dmg

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Bundle aria2
        shell: pwsh
        run: |
          $release = "aria2-1.37.0"
          $build = "$release-win-64bit-build1"
          Invoke-WebRequest `
            -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/$build.zip" `
            -OutFile aria2.zip
          Expand-Archive aria2.zip -DestinationPath aria2-dist
          Copy-Item "aria2-dist/$build/aria2c.exe" target/release/aria2c.exe
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/motrix.exe, target/release/aria2c.exe `
            -DestinationPath Motrix-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: Motrix-windows-x86_64.zip

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libssl-dev libasound2-dev libdbus-1-dev \
            libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          tar czf Motrix-linux-x86_64.tar.gz -C target/release motrix
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: Motrix-linux-x86_64.tar.gz

  release:
    name: Publish release
    needs: [macos, windows, linux]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
